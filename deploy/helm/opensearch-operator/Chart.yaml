  artifacthub.io/license: OSL-3.0
  # A link named "support" is rendered highlighted by Artifact Hub. Keep it lowercase.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.stackable.tech/home/stable/opensearch/
    - name: support
      url: https://github.com/stackabletech/opensearch-operator/issues
  artifacthub.io/crds: |-
