---
data_dir: ${DATA_DIR}

log_schema:
  host_key: pod

sources:
  # Reads logs created with the OpenSearchJsonLayout and the type server
  files_opensearch_server:
    type: file
    include:
      - ${LOG_DIR}/*/${OPENSEARCH_SERVER_LOG_FILE}
    multiline:
      condition_pattern: ^[^{]
      mode: continue_through
      start_pattern: ^\{
      timeout_ms: 100

  # Reads the logs of the containerdebug process
  files_tracing_rs:
    type: file
    include:
      - ${LOG_DIR}/*/*.tracing-rs.json

  # Reads the internal Vector logs
  vector:
    type: internal_logs

transforms:
  # Transforms logs created with the OpenSearchJsonLayout and the type server
  processed_files_opensearch_server:
    inputs:
      - files_opensearch_server
    type: remap
    source: |
      raw_message = string!(.message)

      .logger = ""
      .level = "INFO"
      .message = ""
      .errors = []

      parsed_event, err = parse_json(raw_message)
      if err != null {
        error = "JSON not parsable: " + err
        .errors = push(.errors, error)
        log(error, level: "warn")
        .message = raw_message
      } else if !is_object(parsed_event) {
        error = "Parsed event is not a JSON object."
        .errors = push(.errors, error)
        log(error, level: "warn")
        .message = raw_message
      } else {
        event = object!(parsed_event)

        timestamp_string, err = string(event.timestamp)
        if err == null {
          # OpenSearch 3.1.0 uses log4j2 2.21.0 which renders the timezone using "Z" (Zulu).
          # OpenSearch 3.6.0 and 3.8.0 use log4j2 2.25.x which renders the timezone as a numeric offset (e.g. "...,122+0000").
          # Try the offset format first and fall back to the literal "Z" so both layouts are parsed.
          parsed_timestamp, err = parse_timestamp(timestamp_string, "%Y-%m-%dT%H:%M:%S,%3f%z")
          if err != null {
            parsed_timestamp, err = parse_timestamp(timestamp_string, "%Y-%m-%dT%H:%M:%S,%3fZ", timezone: "Etc/UTC")
          }
          if err == null {
            .timestamp = parsed_timestamp
          } else {
            .errors = push(.errors, "Timestamp not parsable, using current time instead: " + err)
          }
        } else {
          .errors = push(.errors, "Timestamp not found, using current time instead.")
        }

        .logger, err = string(event.component)
        if err != null || is_empty(.logger) {
          .errors = push(.errors, "Logger not found.")
        }

        level, err = string(event.level)
        if err != null {
          .errors = push(.errors, "Level not found, using \"" + .level + "\" instead.")
        } else if level == "DEPRECATION"  {
          .level = "WARN"
        } else if includes(["TRACE", "DEBUG", "INFO", "WARN", "ERROR", "FATAL"], level) {
          .level = level
        } else {
          .errors = push(.errors, "Level \"" + level + "\" unknown, using \"" + .level + "\" instead.")
        }

        .message, err = string(event.message)
        if err != null || is_empty(.message) {
          .errors = push(.errors, "Message not found.")
        }
        stacktrace = join(event.stacktrace, "\n") ?? ""
        .message = join!(compact([.message, stacktrace]), "\n\n")
      }

  # Transforms the tracing-rs JSON logs written by the containerdebug process
  processed_files_tracing_rs:
    inputs:
      - files_tracing_rs
    type: remap
    source: |
      raw_message = string!(.message)

      .logger = ""
      .level = "INFO"
      .message = ""
      .errors = []

      parsed_event, err = parse_json(raw_message)
      if err != null {
        error = "JSON not parsable: " + err
        .errors = push(.errors, error)
        log(error, level: "warn")
        .message = raw_message
      } else if !is_object(parsed_event) {
        error = "Parsed event is not a JSON object."
        .errors = push(.errors, error)
        log(error, level: "warn")
        .message = raw_message
      } else {
        event = object!(parsed_event)

        timestamp_string, err = string(event.timestamp)
        if err == null {
          parsed_timestamp, err = parse_timestamp(timestamp_string, "%+")
          if err == null {
            .timestamp = parsed_timestamp
          } else {
            .errors = push(.errors, "Timestamp not parsable, using current time instead: " + err)
          }
        } else {
          .errors = push(.errors, "Timestamp not found, using current time instead.")
        }

        .logger, err = string(event.target)
        if err != null || is_empty(.logger) {
          .errors = push(.errors, "Logger/target not found.")
        }

        level, err = string(event.level)
        if err != null {
          .errors = push(.errors, "Level not found, using \"" + .level + "\" instead.")
        } else if !includes(["TRACE", "DEBUG", "INFO", "WARN", "ERROR", "FATAL"], upcase(level)) {
          .errors = push(.errors, "Level \"" + level + "\" unknown, using \"" + .level + "\" instead.")
        } else {
          .level = upcase(level)
        }

        fields, err = object(event.fields)
        if err == null {
          message, err = string(fields.message)
          if err == null {
            # The message is prepended to the other fields, so remove it from
            # them.
            del(fields.message)
          } else {
            # Keep an unusable message among the other fields instead of
            # discarding its content.
            message = ""
          }

          other_fields = encode_key_value(fields, field_delimiter: "\n")
          .message = join!(compact([message, other_fields]), "\n\n")
        } else {
          .errors = push(.errors, "Fields are not an object.")
          # Fall back to the raw line, so that its content is not lost.
          .message = raw_message
        }

        if is_empty(.message) {
          .errors = push(.errors, "Message not found.")
        }
      }

  # Extends the processed files with the fields "container" and "file"
  extended_logs_files:
    inputs:
      - processed_files_opensearch_server
      - processed_files_tracing_rs
    type: remap
    source: |
      del(.source_type)
      if .errors == [] {
        del(.errors)
      }
      . |= parse_regex!(.file, r'^${LOG_DIR}/(?P<container>.*?)/(?P<file>.*?)$')

  # Filters the logs of the Vector agent according to the defined log level
  filtered_logs_vector:
    inputs:
      - vector
    type: filter
    condition: >
      (.metadata.level == "TRACE" && "${VECTOR_FILE_LOG_LEVEL}" == "trace") ||
      (.metadata.level == "DEBUG" && includes(["trace", "debug"], "${VECTOR_FILE_LOG_LEVEL}")) ||
      (.metadata.level == "INFO" && includes(["trace", "debug", "info"], "${VECTOR_FILE_LOG_LEVEL}")) ||
      (.metadata.level == "WARN" && includes(["trace", "debug", "info", "warn"], "${VECTOR_FILE_LOG_LEVEL}")) ||
      (.metadata.level == "ERROR" && includes(["trace", "debug", "info", "warn", "error"], "${VECTOR_FILE_LOG_LEVEL}"))

  # Aligns the logs of the Vector agent with the common format
  extended_logs_vector:
    inputs:
      - filtered_logs_vector
    type: remap
    source: |
      .container = "vector"
      .level = .metadata.level
      .logger = .metadata.module_path
      if exists(.file) {
        .processed_file = del(.file)
      }
      del(.metadata)
      del(.pid)
      del(.source_type)

  # Add the fields "namespace", "cluster", "role" and "roleGroup" to all logs
  extended_logs:
    inputs:
      - extended_logs_files
      - extended_logs_vector
    type: remap
    source: |
      .namespace = "${NAMESPACE}"
      .cluster = "${CLUSTER_NAME}"
      .role = "${ROLE_NAME}"
      .roleGroup = "${ROLE_GROUP_NAME}"

sinks:
  # Forward the logs to the Vector aggregator
  aggregator:
    inputs:
      - extended_logs
    type: vector
    routing:
      endpoints:
        - ${VECTOR_AGGREGATOR_ADDRESS}
    compression: zstd
    keepalive: {}
  console:
    inputs:
      - vector
    type: console
    encoding:
      codec: json
