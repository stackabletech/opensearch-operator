# Run tests with `./test-vector.sh`
#
# A downside of these test cases is that they compare the whole event and that the message can
# contain source code positions in vector.yaml, e.g. "function call error for \"parse_timestamp\" at (999:1079)". Please adapt the tests if you change VRL code in vector.yaml.
---
tests:
  - name: Test opensearch_server log entry without stacktrace
    inputs:
      - type: log
        insert_at: processed_files_opensearch_server
        log_fields:
          file: /stackable/log/opensearch/opensearch_server.json
          message: |
            {"type": "server", "timestamp": "2025-10-01T12:47:28,582+0000", "level": "INFO", "component": "o.o.n.Node", "cluster.name": "opensearch", "node.name": "opensearch-nodes-cluster-manager-0", "message": "started", "cluster.uuid": "Jh1D6YAhTmyzkHI7vM1WWw", "node.id": "sk-r0P_TTYuPqaamTFbjKg"  }
          pod: opensearch-nodes-cluster-manager-0
          source_type: file
          timestamp: 2025-10-01T12:47:29.473487331+0000
    outputs:
      - extract_from: extended_logs
        expected_event_count: 1
        conditions:
          - type: vrl
            source: |
              expected_log_event = {
                "cluster": "opensearch",
                "container": "opensearch",
                "file": "opensearch_server.json",
                "level": "INFO",
                "logger": "o.o.n.Node",
                "message": "started",
                "namespace": "default",
                "pod": "opensearch-nodes-cluster-manager-0",
                "role": "nodes",
                "roleGroup": "cluster-manager",
                "timestamp": t'2025-10-01T12:47:28.582+0000'
              }

              assert_eq!(expected_log_event, .)
