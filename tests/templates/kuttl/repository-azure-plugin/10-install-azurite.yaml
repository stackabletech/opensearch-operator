---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: azurite
  labels:
    app.kubernetes.io/name: azurite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azurite
  serviceName: azurite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azurite
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:3.37.0
          command:
            - azurite-blob
            - --location
            - /data
            - --disableTelemetry
            # The account name is in the URL path, not in the FQDN hostname.
            - --disableProductStyleUrl
            - --blobHost
            - 0.0.0.0
            - --cert
            - /tls/tls.crt
            - --key
            - /tls/tls.key
          ports:
            - containerPort: 10000
              name: blobs
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: tls
              mountPath: /tls
      securityContext:
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: test-service-account
      volumes:
        - name: tls
          ephemeral:
            volumeClaimTemplate:
              metadata:
                annotations:
                  secrets.stackable.tech/class: tls
                  secrets.stackable.tech/scope: service=azurite
              spec:
                storageClassName: secrets.stackable.tech
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: "1"
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
spec:
  selector:
    app.kubernetes.io/name: azurite
  ports:
    - port: 10000
      targetPort: 10000
---
apiVersion: v1
kind: Secret
metadata:
  name: azurite-credentials
stringData:
