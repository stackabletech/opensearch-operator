---
# The recreated StatefulSets must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the OpenSearchCluster so that garbage
# collection still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
# The budget is generous on purpose: the sweep recreates both StatefulSets back to
# back (after the restarter has already rolled the pods once for the recreated
# ConfigMaps), so five JVMs boot simultaneously - slower than the staggered install.
timeout: 900
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch-nodes-cluster-manager
  ownerReferences:
    - apiVersion: opensearch.stackable.tech/v1alpha1
      controller: true
      kind: OpenSearchCluster
      name: opensearch
status:
  readyReplicas: 3
  replicas: 3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch-nodes-data
  ownerReferences:
    - apiVersion: opensearch.stackable.tech/v1alpha1
      controller: true
      kind: OpenSearchCluster
      name: opensearch
status:
  readyReplicas: 2
  replicas: 2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensearch-serviceaccount
  ownerReferences:
    - apiVersion: opensearch.stackable.tech/v1alpha1
      controller: true
      kind: OpenSearchCluster
      name: opensearch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensearch-rolebinding
  ownerReferences:
    - apiVersion: opensearch.stackable.tech/v1alpha1
      controller: true
      kind: OpenSearchCluster
      name: opensearch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch
  ownerReferences:
    - apiVersion: opensearch.stackable.tech/v1alpha1
      controller: true
      kind: OpenSearchCluster
      name: opensearch
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: opensearch
  ownerReferences:
    - apiVersion: opensearch.stackable.tech/v1alpha1
      controller: true
      kind: OpenSearchCluster
      name: opensearch
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: opensearch-nodes-cluster-manager
  ownerReferences:
    - apiVersion: opensearch.stackable.tech/v1alpha1
      controller: true
      kind: OpenSearchCluster
      name: opensearch
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: opensearch-nodes-data
  ownerReferences:
    - apiVersion: opensearch.stackable.tech/v1alpha1
      controller: true
      kind: OpenSearchCluster
      name: opensearch
